[package]
name = "llm-router"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible LLM router/gateway with multi-provider routing, failover, and streaming"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-stream = "0.3"
eventsource-stream = "0.6"
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
